name: Voltray CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:  # Allows manual triggering

env:
  # Build type to use
  BUILD_TYPE: Release
  # Directory where build files will be generated
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper versioning
    - name: Cache CMake build output
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}
        key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Create package
      working-directory: ${{ env.BUILD_DIR }}
      shell: cmd
      run: |
        if not exist Voltray-windows mkdir Voltray-windows
        copy ${{ env.BUILD_TYPE }}\Voltray.exe Voltray-windows\
        xcopy /E /I ..\Resources\Shaders Voltray-windows\Shaders
        7z a Voltray-windows.zip Voltray-windows

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Voltray-Windows
        path: ${{ env.BUILD_DIR }}/Voltray-windows.zip

  macos-build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Cache CMake build output
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}
        key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install dependencies
      run: |
        brew update
        brew install cmake
        brew install glfw

    - name: Configure CMake
      run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} -j4

    - name: Test
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Create package
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        mkdir -p Voltray-macos
        cp Voltray Voltray-macos/
        cp -R ../Resources/Shaders Voltray-macos/
        zip -r Voltray-macos.zip Voltray-macos

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Voltray-MacOS
        path: ${{ env.BUILD_DIR }}/Voltray-macos.zip

  linux-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Cache CMake build output
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}
        key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure CMake
      run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} -j$(nproc)

    - name: Test
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Create package
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        mkdir -p Voltray-linux
        cp Voltray Voltray-linux/
        cp -R ../Resources/Shaders Voltray-linux/
        tar -czvf Voltray-linux.tar.gz Voltray-linux
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Voltray-Linux
        path: ${{ env.BUILD_DIR }}/Voltray-linux.tar.gz

  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev clang-format clang-tidy

    - name: Check Code Formatting (clang-format)
      run: |
        find . \( -name "*.h" -o -name "*.cpp" \) -not -path "./Vendor/*" -not -path "./build/*" -print0 | xargs -0 -r clang-format --dry-run -Werror

    - name: Configure CMake for Static Analysis
      run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run Static Analysis (clang-tidy)
      run: |
        find . \( -name "*.h" -o -name "*.cpp" \) -not -path "./Vendor/*" -not -path "./build/*" -print0 | xargs -0 -r clang-tidy -p ${{ env.BUILD_DIR }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-build, macos-build, linux-build, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Voltray-Windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Voltray-MacOS
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Voltray-Linux
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Voltray-windows.zip
            artifacts/Voltray-macos.zip
            artifacts/Voltray-linux.tar.gz
          draft: false
          prerelease: false
